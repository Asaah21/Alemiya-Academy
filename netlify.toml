[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # These two VITE_ values are public by design (the browser needs them); stop the secrets scanner failing the build.
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY"

# Single-page app: send every path to index.html so links and refreshes work
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Browser safety headers: no embedding the site in another page, no guessing file types, no sending page addresses
# to other sites, and no camera, microphone or location use.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
